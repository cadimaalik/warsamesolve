name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/update-landing-page-2QSOw

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: structsolve/package-lock.json

      - name: Install dependencies and build Vite app
        run: |
          cd structsolve
          npm install
          npm run build

      - name: Assemble deploy folder
        run: |
          mkdir -p _site/structsolve
          mkdir -p _site/hydro

          # Copy root-level files (landing page, etc.)
          cp index.html _site/
          cp contact.html _site/
          cp contribution.html _site/
          cp logo.svg _site/

          # Copy HydroSOLVE calculators (plain HTML)
          cp -r hydro/* _site/hydro/

          # Copy built Vite React app into /structsolve/
          cp -r structsolve/dist/* _site/structsolve/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
