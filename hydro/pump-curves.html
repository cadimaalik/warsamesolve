<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        function PumpCurvesCalculator() {
            const [numPumps, setNumPumps] = useState(2);
            const [identicalPumps, setIdenticalPumps] = useState(true);
            const [includeEfficiency, setIncludeEfficiency] = useState(true);
            
            const [pumpCurveMethod, setPumpCurveMethod] = useState('table');
            const [pumpCurveDegree, setPumpCurveDegree] = useState(2);
            const [pumpEquation, setPumpEquation] = useState({ a: '', b: '', c: '', d: '' });
            
            const [efficiencyMethod, setEfficiencyMethod] = useState('table');
            const [efficiencyDegree, setEfficiencyDegree] = useState(2);
            const [efficiencyEquation, setEfficiencyEquation] = useState({ a: '', b: '', c: '', d: '' });
            
            const [pumpData, setPumpData] = useState([
                { Q: '', H: '', eta: '' },
                { Q: '', H: '', eta: '' }
            ]);
            
            const [multiplePumpData, setMultiplePumpData] = useState([]);
            const [unifiedPumpData, setUnifiedPumpData] = useState([
                { Q: '', H: ['', ''], eta: ['', ''] },
                { Q: '', H: ['', ''], eta: ['', ''] }
            ]);
            const [multiplePumpEquations, setMultiplePumpEquations] = useState([]);
            const [multipleEfficiencyEquations, setMultipleEfficiencyEquations] = useState([]);
            const [unifiedQValues, setUnifiedQValues] = useState(true);
            
            
            const [systemProps, setSystemProps] = useState({
                Hs: '',
                L: '',
                D: '',
                f: '0.02',
                Km: '0',
                nu: '1.02e-6'
            });
            
            const [showFInfo, setShowFInfo] = useState(false);
            const [results, setResults] = useState(null);
            const [calculating, setCalculating] = useState(false);
            const [triggerCalc, setTriggerCalc] = useState(false);
            
            const singleChartRef = useRef(null);
            const seriesChartRef = useRef(null);
            const parallelChartRef = useRef(null);
            
            const singleChartInstance = useRef(null);
            const seriesChartInstance = useRef(null);
            const parallelChartInstance = useRef(null);
            
            useEffect(() => {
                if (!identicalPumps && numPumps > 0) {
                    const newMultiplePumpData = [];
                    const newMultiplePumpEquations = [];
                    const newMultipleEfficiencyEquations = [];
                    
                    for (let i = 0; i < numPumps; i++) {
                        newMultiplePumpData.push([
                            { Q: '', H: '', eta: '' },
                            { Q: '', H: '', eta: '' }
                        ]);
                        newMultiplePumpEquations.push({ a: '', b: '', c: '', d: '' });
                        newMultipleEfficiencyEquations.push({ a: '', b: '', c: '', d: '' });
                    }
                    
                    setMultiplePumpData(newMultiplePumpData);
                    setMultiplePumpEquations(newMultiplePumpEquations);
                    setMultipleEfficiencyEquations(newMultipleEfficiencyEquations);
                    
                    // Initialize unified data with correct number of pumps
                    const newUnifiedData = [];
                    for (let i = 0; i < 2; i++) {
                        newUnifiedData.push({
                            Q: '',
                            H: Array(numPumps).fill(''),
                            eta: Array(numPumps).fill('')
                        });
                    }
                    setUnifiedPumpData(newUnifiedData);
                }
            }, [identicalPumps, numPumps]);
            
            // Sync data when toggling between unified and separate tables
            useEffect(() => {
                if (!identicalPumps && pumpCurveMethod === 'table') {
                    if (unifiedQValues && multiplePumpData.length > 0) {
                        // Convert from separate to unified
                        const maxRows = Math.max(...multiplePumpData.map(arr => arr.length));
                        const newUnified = [];
                        for (let rowIdx = 0; rowIdx < maxRows; rowIdx++) {
                            const row = {
                                Q: multiplePumpData[0][rowIdx]?.Q || '',
                                H: multiplePumpData.map(pumpArr => pumpArr[rowIdx]?.H || ''),
                                eta: multiplePumpData.map(pumpArr => pumpArr[rowIdx]?.eta || '')
                            };
                            newUnified.push(row);
                        }
                        setUnifiedPumpData(newUnified);
                    } else if (!unifiedQValues && unifiedPumpData.length > 0) {
                        // Convert from unified to separate
                        const newSeparate = [];
                        for (let pumpIdx = 0; pumpIdx < numPumps; pumpIdx++) {
                            const pumpArr = unifiedPumpData.map(row => ({
                                Q: row.Q,
                                H: row.H[pumpIdx] || '',
                                eta: row.eta[pumpIdx] || ''
                            }));
                            newSeparate.push(pumpArr);
                        }
                        setMultiplePumpData(newSeparate);
                    }
                }
            }, [unifiedQValues]);

            
            useEffect(() => {
                if (triggerCalc) {
                    const timer = setTimeout(() => {
                        calculate();
                        setTriggerCalc(false);
                    }, 150);
                    return () => clearTimeout(timer);
                }
            }, [triggerCalc]);
            
            useEffect(() => {
                if (window.MathJax) {
                    window.MathJax.typesetPromise();
                }
            }, [pumpCurveMethod, pumpCurveDegree, efficiencyMethod, efficiencyDegree]);
            
            useEffect(() => {
                if (results && results.success && window.MathJax) {
                    window.MathJax.typesetPromise();
                }
            }, [results]);
            
            const loadExample = () => {
                setResults(null);
                setNumPumps(2);
                setIdenticalPumps(true);
                setPumpCurveMethod('table');
                setEfficiencyMethod('table');
                setIncludeEfficiency(true);
                
                setPumpData([
                    { Q: '0', H: '70', eta: '45' },
                    { Q: '10', H: '67', eta: '63' },
                    { Q: '20', H: '62.5', eta: '75' },
                    { Q: '30', H: '57.5', eta: '82' },
                    { Q: '40', H: '51', eta: '79' },
                    { Q: '50', H: '43', eta: '71' },
                    { Q: '60', H: '32', eta: '60' }
                ]);
                
                setSystemProps({
                    Hs: '40',
                    L: '2000',
                    D: '0.2',
                    f: '0.02',
                    Km: '0',
                    nu: '1.02e-6'
                });
                
                setTriggerCalc(true);
            };
            
            const addDataRow = () => {
                setPumpData([...pumpData, { Q: '', H: '', eta: '' }]);
            };
            
            const addMultipleRows = (count) => {
                const newRows = Array(count).fill(null).map(() => ({ Q: '', H: '', eta: '' }));
                setPumpData([...pumpData, ...newRows]);
            };
            
            const removeDataRow = (index) => {
                if (pumpData.length > 2) {
                    setPumpData(pumpData.filter((_, i) => i !== index));
                }
            };
            
            const updatePumpData = (index, field, value) => {
                const newData = [...pumpData];
                newData[index][field] = value;
                setPumpData(newData);
            };
            
            const addMultipleDataRow = (pumpIndex) => {
                const newMultipleData = [...multiplePumpData];
                newMultipleData[pumpIndex] = [...newMultipleData[pumpIndex], { Q: '', H: '', eta: '' }];
                setMultiplePumpData(newMultipleData);
            };
            
            const addMultipleDataRows = (pumpIndex, count) => {
                const newMultipleData = [...multiplePumpData];
                const newRows = Array(count).fill(null).map(() => ({ Q: '', H: '', eta: '' }));
                newMultipleData[pumpIndex] = [...newMultipleData[pumpIndex], ...newRows];
                setMultiplePumpData(newMultipleData);
            };
            
            const removeMultipleDataRow = (pumpIndex, rowIndex) => {
                const newMultipleData = [...multiplePumpData];
                if (newMultipleData[pumpIndex].length > 2) {
                    newMultipleData[pumpIndex] = newMultipleData[pumpIndex].filter((_, i) => i !== rowIndex);
                    setMultiplePumpData(newMultipleData);
                }
            };
            
            const updateMultiplePumpData = (pumpIndex, rowIndex, field, value) => {
                const newMultipleData = [...multiplePumpData];
                newMultipleData[pumpIndex][rowIndex][field] = value;
                setMultiplePumpData(newMultipleData);
            };
            
            
            // Unified table helpers (for non-identical with same Q)
            const addUnifiedDataRow = () => {
                const newRow = { Q: '', H: Array(numPumps).fill(''), eta: Array(numPumps).fill('') };
                setUnifiedPumpData([...unifiedPumpData, newRow]);
            };
            
            const addUnifiedDataRows = (count) => {
                const newRows = [];
                for (let i = 0; i < count; i++) {
                    newRows.push({ Q: '', H: Array(numPumps).fill(''), eta: Array(numPumps).fill('') });
                }
                setUnifiedPumpData([...unifiedPumpData, ...newRows]);
            };
            
            const removeUnifiedDataRow = (rowIndex) => {
                if (unifiedPumpData.length > 2) {
                    setUnifiedPumpData(unifiedPumpData.filter((_, i) => i !== rowIndex));
                }
            };
            
            const updateUnifiedPumpData = (rowIndex, field, pumpIndex, value) => {
                const newData = [...unifiedPumpData];
                if (field === 'Q') {
                    newData[rowIndex].Q = value;
                } else if (field === 'H') {
                    newData[rowIndex].H[pumpIndex] = value;
                } else if (field === 'eta') {
                    newData[rowIndex].eta[pumpIndex] = value;
                }
                setUnifiedPumpData(newData);
            };
const updateMultiplePumpEquation = (pumpIndex, coeff, value) => {
                const newEquations = [...multiplePumpEquations];
                newEquations[pumpIndex][coeff] = value;
                setMultiplePumpEquations(newEquations);
            };
            
            const updateMultipleEfficiencyEquation = (pumpIndex, coeff, value) => {
                const newEquations = [...multipleEfficiencyEquations];
                newEquations[pumpIndex][coeff] = value;
                setMultipleEfficiencyEquations(newEquations);
            };
            
            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const table = e.target.closest('table');
                    if (!table) return;
                    
                    const tbody = table.querySelector('tbody');
                    if (!tbody) return;
                    
                    const allRows = Array.from(tbody.querySelectorAll('tr'));
                    const currentRow = e.target.closest('tr');
                    const currentRowIndex = allRows.indexOf(currentRow);
                    
                    // Get current column index
                    const currentCell = e.target.closest('td');
                    const allCells = Array.from(currentRow.querySelectorAll('td'));
                    const currentColIndex = allCells.indexOf(currentCell);
                    
                    // Go to next row, same column
                    if (currentRowIndex < allRows.length - 1) {
                        const nextRow = allRows[currentRowIndex + 1];
                        const nextRowCells = Array.from(nextRow.querySelectorAll('td'));
                        const targetCell = nextRowCells[currentColIndex];
                        if (targetCell) {
                            const targetInput = targetCell.querySelector('input[type="number"]');
                            if (targetInput) {
                                targetInput.focus();
                                targetInput.select();
                            }
                        }
                    }
                }
            };
            
            const validateFrictionFactor = (value) => {
                const num = parseFloat(value);
                if (isNaN(num)) return value;
                if (num < 0) return '0';
                if (num > 1) return '1';
                return value;
            };
            
            const interpolate = (x, xVals, yVals) => {
                if (x <= xVals[0]) return yVals[0];
                if (x >= xVals[xVals.length - 1]) return yVals[xVals.length - 1];
                
                for (let i = 0; i < xVals.length - 1; i++) {
                    if (x >= xVals[i] && x <= xVals[i + 1]) {
                        const t = (x - xVals[i]) / (xVals[i + 1] - xVals[i]);
                        return yVals[i] + t * (yVals[i + 1] - yVals[i]);
                    }
                }
                return yVals[yVals.length - 1];
            };
            
            const calculate = () => {
                setCalculating(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                try {
                    const Hs = parseFloat(systemProps.Hs);
                    const L = parseFloat(systemProps.L);
                    const D = parseFloat(systemProps.D);
                    const f = parseFloat(systemProps.f);
                    const Km = parseFloat(systemProps.Km);
                    const nu = parseFloat(systemProps.nu);
                    
                    if ([Hs, L, D, f, nu].some(v => isNaN(v))) {
                        throw new Error('Please fill in all system properties with valid numbers');
                    }
                    
                    let getPumpH, getPumpEta, maxQ;
                    let pumpHFunctions = []; // For non-identical
                    let pumpEtaFunctions = []; // For non-identical efficiency
                    
                    // IDENTICAL PUMPS
                    if (identicalPumps) {
                        if (pumpCurveMethod === 'table') {
                            const validData = pumpData.filter(d => d.Q !== '' && d.H !== '');
                            if (validData.length < 2) {
                                throw new Error('Please enter at least 2 data points for pump curve');
                            }
                            
                            const Qvals = validData.map(d => parseFloat(d.Q) / 1000);
                            const Hvals = validData.map(d => parseFloat(d.H));
                            maxQ = Math.max(...Qvals);
                            
                            getPumpH = (Q) => {
                                if (Q > maxQ) return null;
                                return interpolate(Q, Qvals, Hvals);
                            };
                        } else {
                            const a = parseFloat(pumpEquation.a) || 0;
                            const b = parseFloat(pumpEquation.b) || 0;
                            const c = pumpCurveDegree >= 2 ? (parseFloat(pumpEquation.c) || 0) : 0;
                            const d = pumpCurveDegree >= 3 ? (parseFloat(pumpEquation.d) || 0) : 0;
                            
                            maxQ = 0.1;
                            
                            getPumpH = (Q) => {
                                const Qls = Q * 1000;
                                if (pumpCurveDegree === 1) return a + b * Qls;
                                if (pumpCurveDegree === 2) return a + b * Qls + c * Qls * Qls;
                                return a + b * Qls + c * Qls * Qls + d * Qls * Qls * Qls;
                            };
                        }
                    } 
                    // NON-IDENTICAL PUMPS
                    else {
                        if (pumpCurveMethod === 'table') {
                            if (unifiedQValues) {
                                // UNIFIED TABLE: Same Q, different H values
                                const validData = unifiedPumpData.filter(d => d.Q !== '');
                                if (validData.length < 2) {
                                    throw new Error('Please enter at least 2 data points with Q values');
                                }
                                
                                const Qvals = validData.map(d => parseFloat(d.Q) / 1000);
                                maxQ = Math.max(...Qvals);
                                
                                // Create function for each pump using shared Q values
                                for (let pumpIdx = 0; pumpIdx < numPumps; pumpIdx++) {
                                    const Hvals = validData.map(d => parseFloat(d.H[pumpIdx]) || 0);
                                    const etaVals = includeEfficiency ? validData.map(d => parseFloat(d.eta[pumpIdx]) || 80) : null;
                                    
                                    pumpHFunctions.push((Q) => {
                                        if (Q > maxQ) return null;
                                        return interpolate(Q, Qvals, Hvals);
                                    });
                                    
                                    if (includeEfficiency) {
                                        pumpEtaFunctions.push((Q) => {
                                            if (Q > maxQ) return null;
                                            return interpolate(Q, Qvals, etaVals);
                                        });
                                    } else {
                                        pumpEtaFunctions.push((Q) => 80);
                                    }
                                }
                            } else {
                                // SEPARATE TABLES: Different Q for each pump
                                maxQ = 0;
                                for (let i = 0; i < numPumps; i++) {
                                    const validData = multiplePumpData[i].filter(d => d.Q !== '' && d.H !== '');
                                    if (validData.length < 2) {
                                        throw new Error(`Please enter at least 2 data points for Pump #${i + 1}`);
                                    }
                                    
                                    const Qvals = validData.map(d => parseFloat(d.Q) / 1000);
                                    const Hvals = validData.map(d => parseFloat(d.H));
                                    const thisMaxQ = Math.max(...Qvals);
                                    maxQ = Math.max(maxQ, thisMaxQ);
                                    
                                    pumpHFunctions.push((Q) => {
                                        if (Q > thisMaxQ) return null;
                                        return interpolate(Q, Qvals, Hvals);
                                    });
                                    
                                    // Efficiency for this pump
                                    if (includeEfficiency) {
                                        const validEtaData = multiplePumpData[i].filter(d => d.Q !== '' && d.eta !== '');
                                        if (validEtaData.length < 2) {
                                            throw new Error(`Please enter at least 2 efficiency points for Pump #${i + 1}`);
                                        }
                                        
                                        const QvalsEta = validEtaData.map(d => parseFloat(d.Q) / 1000);
                                        const etaVals = validEtaData.map(d => parseFloat(d.eta));
                                        
                                        pumpEtaFunctions.push((Q) => {
                                            if (Q > Math.max(...QvalsEta)) return null;
                                            return interpolate(Q, QvalsEta, etaVals);
                                        });
                                    } else {
                                        pumpEtaFunctions.push((Q) => 80);
                                    }
                                }
                            }
                        } else {
                            maxQ = 0.1;
                            for (let i = 0; i < numPumps; i++) {
                                const eq = multiplePumpEquations[i];
                                const a = parseFloat(eq.a) || 0;
                                const b = parseFloat(eq.b) || 0;
                                const c = pumpCurveDegree >= 2 ? (parseFloat(eq.c) || 0) : 0;
                                const d = pumpCurveDegree >= 3 ? (parseFloat(eq.d) || 0) : 0;
                                
                                pumpHFunctions.push((Q) => {
                                    const Qls = Q * 1000;
                                    if (pumpCurveDegree === 1) return a + b * Qls;
                                    if (pumpCurveDegree === 2) return a + b * Qls + c * Qls * Qls;
                                    return a + b * Qls + c * Qls * Qls + d * Qls * Qls * Qls;
                                });
                            }
                        }
                        
                        // For single pump display, use first pump
                        getPumpH = pumpHFunctions[0];
                    }
                    
                    // Efficiency
                    if (includeEfficiency) {
                        if (identicalPumps) {
                            // For identical pumps, create single efficiency function
                            if (efficiencyMethod === 'table') {
                                const validData = pumpData.filter(d => d.Q !== '' && d.eta !== '');
                                if (validData.length < 2) {
                                    throw new Error('Please enter at least 2 data points for efficiency');
                                }
                                
                                const Qvals = validData.map(d => parseFloat(d.Q) / 1000);
                                const etaVals = validData.map(d => parseFloat(d.eta));
                                
                                getPumpEta = (Q) => {
                                    if (Q > maxQ) return null;
                                    return interpolate(Q, Qvals, etaVals);
                                };
                            } else {
                                const a = parseFloat(efficiencyEquation.a) || 0;
                                const b = parseFloat(efficiencyEquation.b) || 0;
                                const c = efficiencyDegree >= 2 ? (parseFloat(efficiencyEquation.c) || 0) : 0;
                                const d = efficiencyDegree >= 3 ? (parseFloat(efficiencyEquation.d) || 0) : 0;
                                
                                getPumpEta = (Q) => {
                                    const Qls = Q * 1000;
                                    if (efficiencyDegree === 1) return a + b * Qls;
                                    if (efficiencyDegree === 2) return a + b * Qls + c * Qls * Qls;
                                    return a + b * Qls + c * Qls * Qls + d * Qls * Qls * Qls;
                                };
                            }
                        } else {
                            // For non-identical, use first pump's efficiency function
                            getPumpEta = pumpEtaFunctions[0] || ((Q) => 80);
                        }
                    } else {
                        getPumpEta = (Q) => 100; // Default 100% if not tracking
                    }
                    
                    const g = 9.81;
                    const K = (8 * f * L) / (g * Math.PI * Math.PI * Math.pow(D, 5));
                    const A = Math.PI * D * D / 4;
                    
                    const calcSystemH = (Q) => {
                        if (Q === 0) return Hs;
                        const hf = K * Q * Q;
                        const hm = Km * (Q * Q) / (2 * g * A * A);
                        return Hs + hf + hm;
                    };
                    
                    const findOperatingPoint = (getH, maxQval) => {
                        const Qrange = [];
                        for (let i = 0; i <= 200; i++) {
                            Qrange.push((i / 200) * maxQval);
                        }
                        
                        let minDiff = Infinity;
                        let opQ, opH, opEta;
                        
                        for (const Q of Qrange) {
                            const Hp = getH(Q);
                            if (Hp === null) continue;
                            
                            const Hsys = calcSystemH(Q);
                            const diff = Math.abs(Hp - Hsys);
                            
                            if (diff < minDiff) {
                                minDiff = diff;
                                opQ = Q;
                                opH = Hp;
                                opEta = getPumpEta(Q);
                            }
                        }
                        
                        return { Q: opQ, H: opH, eta: opEta };
                    };
                    
                    // Single pump
                    const singlePump = findOperatingPoint(getPumpH, maxQ);
                    
                    // Series - ADD heads
                    const getSeriesH = (Q) => {
                        if (identicalPumps) {
                            const h = getPumpH(Q);
                            if (h === null) return null;
                            return h * numPumps;
                        } else {
                            // NON-IDENTICAL: SUM individual heads
                            let totalH = 0;
                            for (let i = 0; i < numPumps; i++) {
                                const h = pumpHFunctions[i](Q);
                                if (h === null) return null;
                                totalH += h;
                            }
                            return totalH;
                        }
                    };
                    
                    const pumpsSeries = findOperatingPoint(getSeriesH, maxQ);
                    
                    // Series combined H table - use EXACT input values (no interpolation)
                    const seriesCombinedTable = [];
                    
                    if (identicalPumps) {
                        // For identical, use input data directly
                        const sourceData = pumpCurveMethod === 'table' 
                            ? pumpData.filter(d => d.Q !== '' && d.H !== '')
                            : null;
                        
                        if (sourceData && sourceData.length > 0) {
                            // Use actual input values
                            for (let i = 0; i < Math.min(6, sourceData.length); i++) {
                                const Hsingle = parseFloat(sourceData[i].H);
                                seriesCombinedTable.push({
                                    Q: parseFloat(sourceData[i].Q),
                                    Hsingle: Hsingle,
                                    Hcombined: Hsingle * numPumps,
                                    individualHeads: null
                                });
                            }
                        } else {
                            // Fallback to interpolation if using equations
                            for (let i = 0; i <= 5; i++) {
                                const Q = (i / 5) * pumpsSeries.Q;
                                const Hsingle = getPumpH(Q);
                                if (Hsingle !== null) {
                                    seriesCombinedTable.push({
                                        Q: Q * 1000,
                                        Hsingle: Hsingle,
                                        Hcombined: Hsingle * numPumps,
                                        individualHeads: null
                                    });
                                }
                            }
                        }
                    } else {
                        // NON-IDENTICAL: Use exact input values
                        if (unifiedQValues && pumpCurveMethod === 'table') {
                            // Use unified table data directly
                            const sourceData = unifiedPumpData.filter(d => d.Q !== '');
                            for (let i = 0; i < Math.min(6, sourceData.length); i++) {
                                const row = sourceData[i];
                                const individualHeads = [];
                                let Hcombined = 0;
                                for (let j = 0; j < numPumps; j++) {
                                    const h = parseFloat(row.H[j]);
                                    if (!isNaN(h)) {
                                        individualHeads.push(h);
                                        Hcombined += h;
                                    }
                                }
                                if (individualHeads.length === numPumps) {
                                    seriesCombinedTable.push({
                                        Q: parseFloat(row.Q),
                                        Hsingle: null,
                                        Hcombined: Hcombined,
                                        individualHeads: individualHeads
                                    });
                                }
                            }
                        } else if (!unifiedQValues && pumpCurveMethod === 'table') {
                            // Use separate tables - take Q from first pump
                            const firstPumpData = multiplePumpData[0].filter(d => d.Q !== '' && d.H !== '');
                            for (let i = 0; i < Math.min(6, firstPumpData.length); i++) {
                                const Q = parseFloat(firstPumpData[i].Q) / 1000;
                                const individualHeads = [];
                                let Hcombined = 0;
                                for (let j = 0; j < numPumps; j++) {
                                    const h = pumpHFunctions[j](Q);
                                    if (h !== null) {
                                        individualHeads.push(h);
                                        Hcombined += h;
                                    }
                                }
                                if (individualHeads.length === numPumps) {
                                    seriesCombinedTable.push({
                                        Q: parseFloat(firstPumpData[i].Q),
                                        Hsingle: null,
                                        Hcombined: Hcombined,
                                        individualHeads: individualHeads
                                    });
                                }
                            }
                        } else {
                            // Fallback to interpolation for equations
                            for (let i = 0; i <= 5; i++) {
                                const Q = (i / 5) * pumpsSeries.Q;
                                const individualHeads = [];
                                let Hcombined = 0;
                                for (let j = 0; j < numPumps; j++) {
                                    const h = pumpHFunctions[j](Q);
                                    if (h !== null) {
                                        individualHeads.push(h);
                                        Hcombined += h;
                                    }
                                }
                                if (individualHeads.length === numPumps) {
                                    seriesCombinedTable.push({
                                        Q: Q * 1000,
                                        Hsingle: null,
                                        Hcombined: Hcombined,
                                        individualHeads: individualHeads
                                    });
                                }
                            }
                        }
                    }
                    
                    // Parallel
                    let pumpsParallel = null;
                    let parallelCombinedTable = [];
                    
                    if (identicalPumps) {
                        const getParallelH = (Q) => {
                            const Qper = Q / numPumps;
                            if (Qper > maxQ) return null;
                            return getPumpH(Qper);
                        };
                        pumpsParallel = findOperatingPoint(getParallelH, maxQ * numPumps);
                        
                        // Use exact input values for parallel table
                        const sourceData = pumpCurveMethod === 'table' 
                            ? pumpData.filter(d => d.Q !== '' && d.H !== '')
                            : null;
                        
                        if (sourceData && sourceData.length > 0) {
                            // Use actual input values
                            for (let i = 0; i < Math.min(6, sourceData.length); i++) {
                                const Qsingle = parseFloat(sourceData[i].Q);
                                const Qcombined = Qsingle * numPumps;
                                const H = parseFloat(sourceData[i].H);
                                parallelCombinedTable.push({
                                    Qsingle: Qsingle,
                                    Qcombined: Qcombined,
                                    H: H
                                });
                            }
                        } else {
                            // Fallback to interpolation for equations
                            for (let i = 0; i <= 5; i++) {
                                const Qsingle = (i / 5) * (pumpsParallel.Q / numPumps);
                                const Qcombined = Qsingle * numPumps;
                                const H = getPumpH(Qsingle);
                                if (H !== null) {
                                    parallelCombinedTable.push({
                                        Qsingle: Qsingle * 1000,
                                        Qcombined: Qcombined * 1000,
                                        H: H
                                    });
                                }
                            }
                        }
                    }
                    
                    const gamma = 9810;
                    const calcPower = (Q, H, eta) => {
                        if (!includeEfficiency) return null;
                        return (gamma * Q * H) / (eta / 100) / 1000;
                    };
                    
                    const singlePower = calcPower(singlePump.Q, singlePump.H, singlePump.eta);
                    const seriesPower = includeEfficiency ? calcPower(pumpsSeries.Q, pumpsSeries.H, pumpsSeries.eta) * numPumps : null;
                    
                    // Chart data
                    const Qrange = [];
                    for (let i = 0; i <= 200; i++) {
                        Qrange.push((i / 200) * maxQ);
                    }
                    
                    const Qrange_sys = [];
                    for (let i = 0; i <= 200; i++) {
                        Qrange_sys.push((i / 200) * maxQ * 1.5);
                    }
                    
                    const singleData = {
                        pumpCurve: Qrange.map(Q => {
                            const h = getPumpH(Q);
                            return h !== null ? { x: Q * 1000, y: h } : null;
                        }).filter(d => d !== null),
                        systemCurve: Qrange_sys.map(Q => ({ x: Q * 1000, y: calcSystemH(Q) })),
                        efficiencyCurve: includeEfficiency ? Qrange.map(Q => {
                            const eta = getPumpEta(Q);
                            return eta !== null ? { x: Q * 1000, y: eta } : null;
                        }).filter(d => d !== null) : [],
                        operatingPoint: { x: singlePump.Q * 1000, y: singlePump.H }
                    };
                    
                    const seriesData = {
                        pumpCurve: Qrange.map(Q => {
                            const h = getSeriesH(Q);
                            return h !== null ? { x: Q * 1000, y: h } : null;
                        }).filter(d => d !== null),
                        systemCurve: Qrange_sys.map(Q => ({ x: Q * 1000, y: calcSystemH(Q) })),
                        efficiencyCurve: includeEfficiency ? Qrange.map(Q => {
                            const eta = getPumpEta(Q);
                            return eta !== null ? { x: Q * 1000, y: eta } : null;
                        }).filter(d => d !== null) : [],
                        operatingPoint: { x: pumpsSeries.Q * 1000, y: pumpsSeries.H }
                    };
                    
                    let parallelData = null;
                    let parallelPower = null;
                    
                    if (identicalPumps) {
                        const Qrange_parallel = [];
                        for (let i = 0; i <= 200; i++) {
                            Qrange_parallel.push((i / 200) * maxQ * numPumps);
                        }
                        
                        parallelData = {
                            pumpCurve: Qrange_parallel.map(Q => {
                                const Qper = Q / numPumps;
                                if (Qper > maxQ) return null;
                                const h = getPumpH(Qper);
                                return h !== null ? { x: Q * 1000, y: h } : null;
                            }).filter(d => d !== null),
                            systemCurve: Qrange_sys.map(Q => ({ x: Q * 1000, y: calcSystemH(Q) })),
                            efficiencyCurve: includeEfficiency ? Qrange.map(Q => {
                                const eta = getPumpEta(Q);
                                return eta !== null ? { x: Q * 1000, y: eta } : null;
                            }).filter(d => d !== null) : [],
                            operatingPoint: { x: pumpsParallel.Q * 1000, y: pumpsParallel.H }
                        };
                        
                        parallelPower = calcPower(pumpsParallel.Q, pumpsParallel.H, pumpsParallel.eta) * numPumps;
                    }
                    
                    setResults({
                        success: true,
                        single: {
                            Q: singlePump.Q,
                            H: singlePump.H,
                            eta: singlePump.eta,
                            power: singlePower,
                            chartData: singleData
                        },
                        series: {
                            Q: pumpsSeries.Q,
                            H: pumpsSeries.H,
                            eta: pumpsSeries.eta,
                            power: seriesPower,
                            chartData: seriesData,
                            combinedTable: seriesCombinedTable
                        },
                        parallel: pumpsParallel ? {
                            Q: pumpsParallel.Q,
                            H: pumpsParallel.H,
                            eta: pumpsParallel.eta,
                            power: parallelPower,
                            chartData: parallelData,
                            combinedTable: parallelCombinedTable
                        } : null,
                        systemEquation: {
                            Hs: Hs,
                            K: K,
                            Km: Km,
                            f: f,
                            L: L,
                            D: D,
                            g: g
                        },
                        numPumps: numPumps,
                        identicalPumps: identicalPumps,
                        includeEfficiency: includeEfficiency
                    });
                    
                } catch (error) {
                    setResults({
                        error: true,
                        message: error.message
                    });
                } finally {
                    setCalculating(false);
                }
            };
            
            const createChart = (canvasRef, chartInstanceRef, data, title, color) => {
                if (chartInstanceRef.current) {
                    chartInstanceRef.current.destroy();
                }
                
                const ctx = canvasRef.current.getContext('2d');
                
                const datasets = [
                    {
                        label: title,
                        data: data.pumpCurve,
                        borderColor: color,
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4,
                        yAxisID: 'y'
                    },
                    {
                        label: 'System Curve',
                        data: data.systemCurve,
                        borderColor: '#ef4444',
                        backgroundColor: 'transparent',
                        borderWidth: 3,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        yAxisID: 'y'
                    }
                ];
                
                if (includeEfficiency && data.efficiencyCurve.length > 0) {
                    datasets.push({
                        label: 'Efficiency',
                        data: data.efficiencyCurve,
                        borderColor: '#fbbf24',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        pointRadius: 0,
                        yAxisID: 'y1'
                    });
                }
                
                datasets.push({
                    label: 'Operating Point',
                    data: [data.operatingPoint],
                    borderColor: '#fff',
                    backgroundColor: color,
                    borderWidth: 3,
                    pointRadius: 10,
                    pointStyle: 'circle',
                    yAxisID: 'y'
                });
                
                const scales = {
                    x: {
                        type: 'linear',
                        title: {
                            display: true,
                            text: 'Flow Rate Q (L/s)',
                            color: '#e5e5e5',
                            font: { family: 'JetBrains Mono', size: 12 }
                        },
                        ticks: {
                            color: '#a3a3a3',
                            font: { family: 'JetBrains Mono', size: 10 }
                        },
                        grid: { color: '#404040' }
                    },
                    y: {
                        type: 'linear',
                        position: 'left',
                        title: {
                            display: true,
                            text: 'Head H (m)',
                            color: '#e5e5e5',
                            font: { family: 'JetBrains Mono', size: 12 }
                        },
                        ticks: {
                            color: '#a3a3a3',
                            font: { family: 'JetBrains Mono', size: 10 }
                        },
                        grid: { color: '#404040' }
                    }
                };
                
                if (includeEfficiency) {
                    scales.y1 = {
                        type: 'linear',
                        position: 'right',
                        title: {
                            display: true,
                            text: 'η (%)',
                            color: '#fbbf24',
                            font: { family: 'JetBrains Mono', size: 12 }
                        },
                        ticks: {
                            color: '#fbbf24',
                            font: { family: 'JetBrains Mono', size: 10 }
                        },
                        grid: { display: false }
                    };
                }
                
                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: { datasets: datasets },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            mode: 'index',
                            intersect: false
                        },
                        plugins: {
                            legend: {
                                labels: {
                                    color: '#e5e5e5',
                                    font: { family: 'JetBrains Mono', size: 11 },
                                    usePointStyle: true,
                                    pointStyle: 'line'
                                }
                            },
                            tooltip: {
                                backgroundColor: '#171717',
                                titleColor: '#4ade80',
                                bodyColor: '#e5e5e5',
                                borderColor: '#404040',
                                borderWidth: 1,
                                yAlign: 'bottom',
                                xAlign: 'center',
                                caretPadding: 10
                            }
                        },
                        scales: scales
                    }
                });
            };
            
            useEffect(() => {
                if (results && results.success) {
                    if (singleChartRef.current) {
                        createChart(singleChartRef, singleChartInstance, results.single.chartData, 'Single Pump', '#4ade80');
                    }
                    if (seriesChartRef.current) {
                        createChart(seriesChartRef, seriesChartInstance, results.series.chartData, `Pumps in Series (×${results.numPumps})`, '#a78bfa');
                    }
                    if (parallelChartRef.current && results.parallel) {
                        createChart(parallelChartRef, parallelChartInstance, results.parallel.chartData, `Pumps in Parallel (×${results.numPumps})`, '#60a5fa');
                    }
                }
            }, [results, includeEfficiency]);
            
            return (
