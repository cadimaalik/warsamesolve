                                                        {efficiencyDegree === 1 && <span>{"$$\\eta = a + bQ$$"}</span>}
                                                        {efficiencyDegree === 2 && <span>{"$$\\eta = a + bQ + cQ^2$$"}</span>}
                                                        {efficiencyDegree === 3 && <span>{"$$\\eta = a + bQ + cQ^2 + dQ^3$$"}</span>}
                                                    </div>
                                                    
                                                    <div className="input-group">
                                                        <label>Coefficient a</label>
                                                        <input 
                                                            type="number" onWheel={(e) => e.target.blur()}
                                                            step="any"
                                                            value={efficiencyEquation.a}
                                                            onChange={(e) => setEfficiencyEquation({...efficiencyEquation, a: e.target.value})}
                                                            placeholder="80"
                                                        />
                                                    </div>
                                                    
                                                    <div className="input-group">
                                                        <label>Coefficient b</label>
                                                        <input 
                                                            type="number" onWheel={(e) => e.target.blur()}
                                                            step="any"
                                                            value={efficiencyEquation.b}
                                                            onChange={(e) => setEfficiencyEquation({...efficiencyEquation, b: e.target.value})}
                                                            placeholder="0"
                                                        />
                                                    </div>
                                                    
                                                    {efficiencyDegree >= 2 && (
                                                        <div className="input-group">
                                                            <label>Coefficient c</label>
                                                            <input 
                                                                type="number" onWheel={(e) => e.target.blur()}
                                                                step="any"
                                                                value={efficiencyEquation.c}
                                                                onChange={(e) => setEfficiencyEquation({...efficiencyEquation, c: e.target.value})}
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                    )}
                                                    
                                                    {efficiencyDegree >= 3 && (
                                                        <div className="input-group">
                                                            <label>Coefficient d</label>
                                                            <input 
                                                                type="number" onWheel={(e) => e.target.blur()}
                                                                step="any"
                                                                value={efficiencyEquation.d}
                                                                onChange={(e) => setEfficiencyEquation({...efficiencyEquation, d: e.target.value})}
                                                                placeholder="0"
                                                            />
                                                        </div>
                                                    )}
                                                </>
                                            )}
                                        </>
                                    )}
                                    
                                    {efficiencyMethod === 'table' && (
                                        <>
                                            <div className="info-box">
                                                💡 Enter Q (flow rate) and η (efficiency) values. Since you're using equations for pump curves, efficiency data is separate.
                                            </div>
                                            
                                            {!identicalPumps ? (
                                                multiplePumpData.map((pumpDataArray, pumpIndex) => (
                                                    <div key={pumpIndex} className="pump-section-divider">
                                                        <div className="pump-section-title">
                                                            Pump #{pumpIndex + 1} Efficiency
                                                        </div>
                                                        <table className="data-table">
                                                            <thead>
                                                                <tr>
                                                                    <th>Q (L/s)</th>
                                                                    <th>η (%)</th>
                                                                    <th></th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {pumpDataArray.map((row, rowIndex) => (
                                                                    <tr key={rowIndex}>
                                                                        <td>
                                                                            <input 
                                                                                type="number" onWheel={(e) => e.target.blur()}
                                                                                step="any"
                                                                                value={row.Q}
                                                                                onChange={(e) => updateMultiplePumpData(pumpIndex, rowIndex, 'Q', e.target.value)}
                                                                                onKeyDown={handleKeyDown}
                                                                                placeholder="0"
                                                                            />
                                                                        </td>
                                                                        <td>
                                                                            <input 
                                                                                type="number" onWheel={(e) => e.target.blur()}
                                                                                step="any"
                                                                                value={row.eta}
                                                                                onChange={(e) => updateMultiplePumpData(pumpIndex, rowIndex, 'eta', e.target.value)}
                                                                                onKeyDown={handleKeyDown}
                                                                                placeholder="80"
                                                                            />
                                                                        </td>
                                                                        <td>
                                                                            {pumpDataArray.length > 2 && (
                                                                                <button 
                                                                                    className="btn-small"
                                                                                    onClick={() => removeMultipleDataRow(pumpIndex, rowIndex)}
                                                                                    style={{fontSize: '0.7rem', padding: '4px 8px', margin: 0}}
                                                                                >
                                                                                    ✕
                                                                                </button>
                                                                            )}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                        <button className="btn-small" onClick={() => addMultipleDataRow(pumpIndex)}>+ Add Row</button>
                                                        <button className="btn-small" onClick={() => addMultipleDataRows(pumpIndex, 5)}>+ Add 5 Rows</button>
                                                        <button className="btn-small" onClick={() => addMultipleDataRows(pumpIndex, 10)}>+ Add 10 Rows</button>
                                                    </div>
                                                ))
                                            ) : (
                                                <>
                                                    <table className="data-table">
                                                        <thead>
                                                            <tr>
                                                                <th>Q (L/s)</th>
                                                                <th>η (%)</th>
                                                                <th></th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {pumpData.map((row, i) => (
                                                                <tr key={i}>
                                                                    <td>
                                                                        <input 
                                                                            type="number" onWheel={(e) => e.target.blur()}
                                                                            step="any"
                                                                            value={row.Q}
                                                                            onChange={(e) => updatePumpData(i, 'Q', e.target.value)}
                                                                            onKeyDown={handleKeyDown}
                                                                            placeholder="0"
                                                                        />
                                                                    </td>
                                                                    <td>
                                                                        <input 
                                                                            type="number" onWheel={(e) => e.target.blur()}
                                                                            step="any"
                                                                            value={row.eta}
                                                                            onChange={(e) => updatePumpData(i, 'eta', e.target.value)}
                                                                            onKeyDown={handleKeyDown}
                                                                            placeholder="80"
                                                                        />
                                                                    </td>
                                                                    <td>
                                                                        {pumpData.length > 2 && (
                                                                            <button 
                                                                                className="btn-small"
                                                                                onClick={() => removeDataRow(i)}
                                                                                style={{fontSize: '0.7rem', padding: '4px 8px', margin: 0}}
                                                                            >
                                                                                ✕
                                                                            </button>
                                                                        )}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                    <button className="btn-small" onClick={addDataRow}>+ Add Row</button>
                                                    <button className="btn-small" onClick={() => addDataRows(5)}>+ Add 5 Rows</button>
                                                    <button className="btn-small" onClick={() => addDataRows(10)}>+ Add 10 Rows</button>
                                                </>
                                            )}
                                        </>
                                    )}
                                </div>
                            )}
                            
                            <div className="form-section">
                                <div className="section-label">System Properties</div>
                                
                                <div className="input-group">
                                    <label>Static Head Hs (m)</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="any"
                                        value={systemProps.Hs}
                                        onChange={(e) => setSystemProps({...systemProps, Hs: e.target.value})}
                                        placeholder="40"
                                    />
                                </div>
                                
                                <div className="input-group">
                                    <label>Pipe Length L (m)</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="any"
                                        value={systemProps.L}
                                        onChange={(e) => setSystemProps({...systemProps, L: e.target.value})}
                                        placeholder="2000"
                                    />
                                </div>
                                
                                <div className="input-group">
                                    <label>Pipe Diameter D (m)</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="any"
                                        value={systemProps.D}
                                        onChange={(e) => setSystemProps({...systemProps, D: e.target.value})}
                                        placeholder="0.2"
                                    />
                                </div>
                                
                                <div className="input-group">
                                    <label>Friction Factor f</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="0.0001"
                                        min="0"
                                        max="1"
                                        value={systemProps.f}
                                        onChange={(e) => {
                                            const validated = validateFrictionFactor(e.target.value);
                                            setSystemProps({...systemProps, f: validated});
                                            setShowFInfo(true);
                                        }}
                                        
                                        placeholder="0.02"
                                    />
                                    {showFInfo && (
                                        <div className="info-box">
                                            💡 If friction factor is unknown, use our <a href="darcy-weisbach.html?v=1770404999" target="_blank">Darcy-Weisbach Calculator</a> to compute it.
                                        </div>
                                    )}
                                </div>
                                
                                <div className="input-group">
                                    <label>Minor Loss Coefficient Km</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="any"
                                        value={systemProps.Km}
                                        onChange={(e) => setSystemProps({...systemProps, Km: e.target.value})}
                                        placeholder="0"
                                    />
                                </div>
                                
                                <div className="input-group">
                                    <label>Kinematic Viscosity ν (m²/s)</label>
                                    <input 
                                        type="number" onWheel={(e) => e.target.blur()}
                                        step="any"
                                        value={systemProps.nu}
                                        onChange={(e) => setSystemProps({...systemProps, nu: e.target.value})}
                                        placeholder="1.02e-6"
                                    />
                                </div>
                            </div>
                            
                            <button className="calculate-button" onClick={calculate} disabled={calculating}>
                                {calculating ? 'Calculating...' : 'Calculate All Configurations'}
                            </button>
                        </div>
                        
                        <div className="results-panel">
                            <div className="panel-title">Results</div>
                            
                            {!results && !calculating && (
                                <div className="results-empty">
                                    <button 
                                        className="calculate-btn" 
                                        onClick={loadExample}
                                        style={{ maxWidth: '300px', margin: '0 auto' }}
                                    >
                                        Load Example 2.12
                                    </button>
                                    <p style={{ marginTop: '16px', fontSize: '0.875rem', color: 'var(--text-muted)' }}>
                                        Loads sample problem from Example 2.12
                                    </p>
                                </div>
                            )}
                            
                            {results && results.error && (
                                <div className="result-card error">
                                    <div className="result-header error">⚠ Error</div>
                                    <p>{results.message}</p>
                                </div>
                            )}
                            
                            {results && results.success && (
                                <>
                                    <div className="result-card success">
                                        <div className="result-header">✓ Operating Points Found</div>
                                        <table className="results-table">
                                            <thead>
                                                <tr>
                                                    <th>Configuration</th>
                                                    <th>Q (L/s)</th>
                                                    <th>H (m)</th>
                                                    {results.includeEfficiency && <th>η (%)</th>}
                                                    {results.includeEfficiency && <th>P (kW)</th>}
                                                    {results.includeEfficiency && <th>P/Q (kW·s/L)</th>}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {(results.identicalPumps || results.numPumps === 1) && (
                                                    <tr>
                                                        <td>Single Pump</td>
                                                        <td>{(results.single.Q * 1000).toFixed(1)}</td>
                                                        <td>{results.single.H.toFixed(1)}</td>
                                                        {results.includeEfficiency && <td>{results.single.eta.toFixed(0)}</td>}
                                                        {results.includeEfficiency && <td>{results.single.power.toFixed(1)}</td>}
                                                        {results.includeEfficiency && <td>{(results.single.power / (results.single.Q * 1000)).toFixed(2)}</td>}
                                                    </tr>
                                                )}
                                                {results.numPumps > 1 && (
                                                    <tr>
                                                        <td>Pumps in Series (×{results.numPumps})</td>
                                                        <td>{(results.series.Q * 1000).toFixed(1)}</td>
                                                        <td>{results.series.H.toFixed(1)}</td>
                                                        {results.includeEfficiency && <td>{results.series.eta.toFixed(0)}</td>}
                                                        {results.includeEfficiency && <td>{results.series.power ? results.series.power.toFixed(1) : 'N/A'}</td>}
                                                        {results.includeEfficiency && <td>{results.series.power ? (results.series.power / (results.series.Q * 1000)).toFixed(2) : 'N/A'}</td>}
                                                    </tr>
                                                )}
                                                {results.parallel && results.numPumps > 1 && (
                                                    <tr>
                                                        <td>Pumps in Parallel (×{results.numPumps})</td>
                                                        <td>{(results.parallel.Q * 1000).toFixed(1)}</td>
                                                        <td>{results.parallel.H.toFixed(1)}</td>
                                                        {results.includeEfficiency && <td>{results.parallel.eta.toFixed(0)}</td>}
                                                        {results.includeEfficiency && <td>{results.parallel.power ? results.parallel.power.toFixed(1) : 'N/A'}</td>}
                                                        {results.includeEfficiency && <td>{results.parallel.power ? (results.parallel.power / (results.parallel.Q * 1000)).toFixed(2) : 'N/A'}</td>}
                                                    </tr>
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                    
                                    <div className="result-card">
                                        <div className="result-header">System Curve Equation</div>
                                        <div className="math-display">
                                            <p><strong>Energy Equation (Bernoulli):</strong></p>
                                            <p>{"$$\\frac{p_1}{\\gamma} + \\frac{V_1^2}{2g} + z_1 = \\frac{p_2}{\\gamma} + \\frac{V_2^2}{2g} + z_2 + h_f + h_m - H_p$$"}</p>
                                            <p>For reservoirs (p₁/γ = p₂/γ = 0, V₁ = V₂ = 0):</p>
                                            <p>{"$$z_1 = z_2 + h_f + h_m - H_p$$"}</p>
                                            <p>Rearranging:</p>
                                            <p>{"$$H_p = (z_2 - z_1) + h_f + h_m = \\Delta z + h_f + h_m$$"}</p>
                                            <p><strong>Head Losses:</strong></p>
                                            <p>{"$$h_f = f \\frac{L}{D} \\frac{V^2}{2g} = f \\frac{L}{D} \\frac{1}{2g} \\left(\\frac{Q}{A}\\right)^2 = KQ^2$$"}</p>
                                            <p>{"$$h_m = K_m \\frac{V^2}{2g} = K_m \\frac{Q^2}{2gA^2}$$"}</p>
                                            <p><strong>Friction Coefficient K:</strong></p>
                                            <p>{"$$K = \\frac{8fL}{g\\pi^2D^5}$$"}</p>
                                            <p>{"$$K = \\frac{8 \\times " + results.systemEquation.f.toFixed(3) + " \\times " + results.systemEquation.L.toFixed(0) + "}{" + results.systemEquation.g.toFixed(2) + " \\times \\pi^2 \\times " + results.systemEquation.D.toFixed(2) + "^5} = " + results.systemEquation.K.toFixed(2) + "$$"}</p>
                                            <p><strong>System Curve:</strong></p>
                                            <p>{"$$H_p = H_s + KQ^2 + K_mQ^2$$"}</p>
                                            <p>{"$$H_p = " + results.systemEquation.Hs.toFixed(1) + " + " + results.systemEquation.K.toFixed(2) + "Q^2 + " + results.systemEquation.Km.toFixed(2) + "Q^2$$"}</p>
                                        </div>
                                    </div>
                                    
                                    
                                    {numPumps === 1 && (
                                        <div className="info-box" style={{marginBottom: 'calc(var(--grid) * 4)'}}>
                                            💡 With 1 pump selected, only Single Pump configuration is calculated. Add 2+ pumps to see Series and Parallel configurations.
                                        </div>
                                    )}
                                    
                                    {!identicalPumps && numPumps > 1 && (
                                        <div className="info-box" style={{marginBottom: 'calc(var(--grid) * 4)'}}>
                                            💡 For non-identical pumps, Single Pump configuration is skipped (no way to determine which pump to use). Only Series configuration is calculated.
                                        </div>
                                    )}
                                    
                                    {(identicalPumps || numPumps === 1) && results.single && (
                                        <div className="config-section">
                                            <div className="config-header">Single Pump</div>
                                        <div className="chart-container">
                                            <canvas ref={singleChartRef}></canvas>
                                        </div>
                                        <div className="result-stats">
                                            <div className="stat-item">
                                                <div className="stat-label">Flow Rate (Q)</div>
                                                <div className="stat-value">{(results.single.Q * 1000).toFixed(2)} L/s</div>
                                            </div>
                                            <div className="stat-item">
                                                <div className="stat-label">Head (Hp)</div>
                                                <div className="stat-value">{results.single.H.toFixed(2)} m</div>
                                            </div>
                                            {results.includeEfficiency && (
                                                <>
                                                    <div className="stat-item">
                                                        <div className="stat-label">Efficiency (η)</div>
                                                        <div className="stat-value">{results.single.eta.toFixed(1)}%</div>
                                                    </div>
                                                    <div className="stat-item">
                                                        <div className="stat-label">Power (P)</div>
                                                        <div className="stat-value">{results.single.power ? results.single.power.toFixed(2) + ' kW' : 'N/A'}</div>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                    </div>
                                    )}
                                    
                                    {numPumps > 1 && (
                                    <div className="config-section">
                                        <div className="config-header">Pumps in Series (×{results.numPumps})</div>
                                        <div className="chart-container">
                                            <canvas ref={seriesChartRef}></canvas>
                                        </div>
                                        <div className="result-stats">
                                            <div className="stat-item">
                                                <div className="stat-label">Flow Rate (Q)</div>
                                                <div className="stat-value">{(results.series.Q * 1000).toFixed(2)} L/s</div>
                                            </div>
                                            <div className="stat-item">
                                                <div className="stat-label">Total Head (ΣHp)</div>
                                                <div className="stat-value">{results.series.H.toFixed(2)} m</div>
                                            </div>
                                            {results.includeEfficiency && (
                                                <>
                                                    <div className="stat-item">
                                                        <div className="stat-label">Efficiency (η)</div>
                                                        <div className="stat-value">{results.series.eta.toFixed(1)}%</div>
                                                    </div>
                                                    <div className="stat-item">
                                                        <div className="stat-label">Total Power (ΣP)</div>
                                                        <div className="stat-value">{results.series.power ? results.series.power.toFixed(2) + ' kW' : 'N/A'}</div>
                                                    </div>
                                                </>
                                            )}
                                        </div>
                                        
                                        <div style={{marginTop: 'calc(var(--grid) * 2)'}}>
                                            <strong style={{fontFamily: 'JetBrains Mono', color: 'var(--accent)', fontSize: '0.875rem'}}>
                                                How Heads Combine in Series:
                                            </strong>
                                            <table className="combined-table">
                                                <thead>
                                                    <tr>
                                                        <th>Q (L/s)</th>
                                                        {results.identicalPumps ? (
                                                            <>
                                                                <th>H_single (m)</th>
                                                                <th>H_combined (m)</th>
                                                            </>
                                                        ) : (
                                                            <>
                                                                {results.series.combinedTable[0]?.individualHeads?.map((_, i) => {
                                                                    const subscript = i === 0 ? '₁' : i === 1 ? '₂' : i === 2 ? '₃' : i === 3 ? '₄' : i === 4 ? '₅' : `₁${i+1}`;
                                                                    return <th key={i}>H{subscript} (m)</th>;
                                                                })}
                                                                <th>H_total (m)</th>
                                                            </>
                                                        )}
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {results.series.combinedTable.map((row, i) => (
                                                        <tr key={i}>
                                                            <td>{row.Q}</td>
                                                            {results.identicalPumps ? (
                                                                <>
                                                                    <td>{row.Hsingle}</td>
                                                                    <td>{row.Hcombined}</td>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    {row.individualHeads.map((h, j) => (
                                                                        <td key={j}>{h}</td>
                                                                    ))}
                                                                    <td>{row.Hcombined}</td>
                                                                </>
                                                            )}
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                            <div className="table-note">
                                                {results.identicalPumps 
                                                    ? `Note: In series, heads add while flow remains constant (H_combined = ${results.numPumps} × H_single)`
                                                    : `Note: In series, heads ADD for each pump at the same flow rate (H_total = H₁ + H₂ + ... + H${results.numPumps})`
                                                }
                                            </div>
                                        </div>
                                    </div>
                                    )}
                                    
                                    {results.parallel && numPumps > 1 ? (
                                        <div className="config-section">
                                            <div className="config-header">Pumps in Parallel (×{results.numPumps})</div>
                                            <div className="chart-container">
                                                <canvas ref={parallelChartRef}></canvas>
                                            </div>
                                            <div className="result-stats">
                                                <div className="stat-item">
                                                    <div className="stat-label">Total Flow Rate (ΣQ)</div>
                                                    <div className="stat-value">{(results.parallel.Q * 1000).toFixed(2)} L/s</div>
                                                </div>
                                                <div className="stat-item">
                                                    <div className="stat-label">Head (Hp)</div>
                                                    <div className="stat-value">{results.parallel.H.toFixed(2)} m</div>
                                                </div>
                                                {results.includeEfficiency && (
                                                    <>
                                                        <div className="stat-item">
                                                            <div className="stat-label">Efficiency (η)</div>
                                                            <div className="stat-value">{results.parallel.eta.toFixed(1)}%</div>
                                                        </div>
                                                        <div className="stat-item">
                                                            <div className="stat-label">Total Power (ΣP)</div>
                                                            <div className="stat-value">{results.parallel.power ? results.parallel.power.toFixed(2) + ' kW' : 'N/A'}</div>
                                                        </div>
                                                    </>
                                                )}
                                            </div>
                                            
                                            <div style={{marginTop: 'calc(var(--grid) * 2)'}}>
                                                <strong style={{fontFamily: 'JetBrains Mono', color: 'var(--accent)', fontSize: '0.875rem'}}>
                                                    How Flows Combine in Parallel:
                                                </strong>
                                                <table className="combined-table">
                                                    <thead>
                                                        <tr>
                                                            <th>Q₁ (L/s)</th>
                                                            <th>Q_total (L/s)</th>
                                                            <th>H (m)</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {results.parallel.combinedTable.map((row, i) => (
                                                            <tr key={i}>
                                                                <td>{row.Qsingle}</td>
                                                                <td>{row.Qcombined}</td>
                                                                <td>{row.H}</td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                                <div className="table-note">
                                                    Note: In parallel, flows add while head remains constant (Q_total = {results.numPumps} × Q₁)
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="config-section">
                                            <div className="config-header">Pumps in Parallel</div>
                                            <div className="warning-box">
                                                ⚠ Parallel configuration cannot be calculated for non-identical pumps. Only identical pumps can operate in parallel.
                                            </div>
                                        </div>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<PumpCurvesCalculator />, document.getElementById('root'));
    </script>
</body>
</html>
