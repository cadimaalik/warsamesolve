<body>
    <div id="root"><p style="color:#e5e5e5;font-family:monospace;padding:48px;text-align:center;">Loading calculator...</p></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const g = 9.81;

        // ===================== HELPERS =====================

        function calcE(y, q) {
            return y + (q * q) / (2 * g * y * y);
        }

        function calcFr(y, q) {
            return q / Math.sqrt(g * y * y * y);
        }

        function calcYc(q) {
            return Math.pow(q * q / g, 1.0 / 3.0);
        }

        function calcEmin(q) {
            return 1.5 * calcYc(q);
        }

        // Solve for y given E and q (cubic: y^3 - E*y^2 + q^2/(2g) = 0)
        // Returns { ySub, ySup } (subcritical and supercritical roots)
        function solveAlternateDepths(E, q) {
            var yc = calcYc(q);
            var Ec = 1.5 * yc;
            if (E < Ec - 1e-9) return null; // no real solution

            var c = q * q / (2 * g);
            var iterations_sub = [];
            var iterations_sup = [];

            // Newton-Raphson for subcritical root (start above yc)
            var y = Math.max(E * 0.9, yc * 1.1);
            for (var i = 0; i < 50; i++) {
                var f_val = y * y * y - E * y * y + c;
                var fp = 3 * y * y - 2 * E * y;
                if (Math.abs(fp) < 1e-15) break;
                var Ecalc = calcE(y, q);
                iterations_sub.push({ iteration: i + 1, y: y, Ecalc: Ecalc, error: Ecalc - E });
                if (Math.abs(f_val) < 1e-9) break;
                y = y - f_val / fp;
                if (y < yc) y = yc * 1.01;
            }
            var ySub = y;

            // Newton-Raphson for supercritical root (start below yc)
            y = Math.min(c / (E * 0.5), yc * 0.9);
            if (y < 0.001) y = yc * 0.5;
            for (var i = 0; i < 50; i++) {
                var f_val = y * y * y - E * y * y + c;
                var fp = 3 * y * y - 2 * E * y;
                if (Math.abs(fp) < 1e-15) break;
                var Ecalc = calcE(y, q);
                iterations_sup.push({ iteration: i + 1, y: y, Ecalc: Ecalc, error: Ecalc - E });
                if (Math.abs(f_val) < 1e-9) break;
                y = y - f_val / fp;
                if (y > yc) y = yc * 0.99;
                if (y < 0.001) y = 0.001;
            }
            var ySup = y;

            return { ySub: ySub, ySup: ySup, iterations_sub: iterations_sub, iterations_sup: iterations_sup };
        }

        // ===================== MAIN COMPONENT =====================

        function SpecificEnergyCalc() {
            var _useState1 = useState('step');
            var transType = _useState1[0], setTransType = _useState1[1];

            var _useState2 = useState({ b1: '', b2: '', Q: '', y1: '', deltaZ: '' });
            var inputs = _useState2[0], setInputs = _useState2[1];

            var _useState3 = useState(null);
            var results = _useState3[0], setResults = _useState3[1];

            var chartRef = useRef(null);
            var chartInstance = useRef(null);

            useEffect(function() {
                if (results && window.MathJax) {
                    setTimeout(function() { window.MathJax.typesetPromise(); }, 150);
                }
            }, [results]);

            useEffect(function() {
                if (results && results.success) {
                    drawChart(results);
                }
                return function() {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [results]);

            var handleInputChange = function(field, value) {
                setInputs(function(prev) {
                    var next = {};
                    for (var k in prev) next[k] = prev[k];
                    next[field] = value;
                    return next;
                });
            };

            var loadExample = function(ex) {
                var data;
                if (ex === 'stepDown') {
                    data = { b1: '2.5', b2: '2.5', Q: '6.0', y1: '1.5', deltaZ: '-0.25' };
                    setTransType('step');
                } else if (ex === 'contraction') {
                    data = { b1: '3.0', b2: '2.4', Q: '8.0', y1: '1.5', deltaZ: '0' };
                    setTransType('width');
                } else if (ex === 'choking') {
                    data = { b1: '3.0', b2: '2.0', Q: '8.0', y1: '1.5', deltaZ: '0' };
                    setTransType('width');
                }
                setInputs(data);
                setTimeout(function() {
                    calculateWithValues(ex === 'stepDown' ? 'step' : 'width', {
                        b1: parseFloat(data.b1), b2: parseFloat(data.b2),
                        Q: parseFloat(data.Q), y1: parseFloat(data.y1),
                        deltaZ: parseFloat(data.deltaZ)
                    });
                }, 100);
            };

            var drawChart = function(r) {
                if (!chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();

                var q1 = r.q1, q2 = r.q2;
                var hasTwoQ = Math.abs(q2 - q1) > 0.001;
                var yMax = Math.max(r.y1, r.y2 || r.yc2, r.yc1, r.yc2) * 2.5;
                var EMax = Math.max(r.E1, r.E2 || r.E1) * 1.6;

                // Generate E-y curve for a given q (fine resolution for smooth curve)
                function genCurve(q, maxE, maxY) {
                    var pts = [];
                    var yc = calcYc(q);
                    // Supercritical branch (y from small up to yc) - sorted by ascending y
                    for (var yy = 0.02; yy <= yc; yy += 0.005) {
                        var E = calcE(yy, q);
                        if (E <= maxE) pts.push({ x: E, y: yy });
                    }
                    // Critical point
                    pts.push({ x: 1.5 * yc, y: yc });
                    // Subcritical branch (y from yc upward)
                    for (var yy = yc + 0.005; yy <= maxY; yy += 0.005) {
                        var E = calcE(yy, q);
                        if (E <= maxE) pts.push({ x: E, y: yy });
                    }
                    return pts;
                }

                var curve1 = genCurve(q1, EMax, yMax);
                var curve2 = hasTwoQ ? genCurve(q2, EMax, yMax) : [];

                // E = y line
                var eLine = [];
                var maxDiag = Math.min(yMax, EMax);
                for (var v = 0; v <= maxDiag; v += 0.1) {
                    eLine.push({ x: v, y: v });
                }

                var datasets = [];

                // q1 curve
                datasets.push({
                    label: 'q\u2081 = ' + q1.toFixed(3) + ' m\u00B3/s/m',
                    data: curve1,
                    borderColor: '#4ade80',
                    backgroundColor: 'transparent',
                    borderWidth: 2.5,
                    pointRadius: 0,
                    showLine: true,
                    tension: 0.3,
                    order: 3
                });

                // q2 curve
                if (hasTwoQ) {
                    datasets.push({
                        label: 'q\u2082 = ' + q2.toFixed(3) + ' m\u00B3/s/m',
                        data: curve2,
                        borderColor: '#ef4444',
                        backgroundColor: 'transparent',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        showLine: true,
                        tension: 0.3,
                        order: 3
                    });
                }

                // E = y diagonal
                datasets.push({
                    label: 'E = y',
                    data: eLine,
                    borderColor: '#505050',
                    borderDash: [6, 4],
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    showLine: true,
                    order: 4
                });

                // Dashed reference lines: horizontal from y1 to its E, and from y2 to its E
                // Section 1 horizontal dashed line
                datasets.push({
                    label: null,
                    data: [{ x: 0, y: r.y1 }, { x: r.E1, y: r.y1 }],
                    borderColor: 'rgba(251,191,36,0.4)',
                    borderDash: [4, 4],
                    backgroundColor: 'transparent',
                    borderWidth: 1,
                    pointRadius: 0,
                    showLine: true,
                    order: 5
                });
                // Section 1 vertical dashed line
                datasets.push({
                    label: null,
                    data: [{ x: r.E1, y: 0 }, { x: r.E1, y: r.y1 }],
                    borderColor: 'rgba(251,191,36,0.4)',
                    borderDash: [4, 4],
                    backgroundColor: 'transparent',
                    borderWidth: 1,
                    pointRadius: 0,
                    showLine: true,
                    order: 5
                });

                if (r.y2 && r.E2) {
                    // Section 2 horizontal dashed
                    datasets.push({
                        label: null,
                        data: [{ x: 0, y: r.y2 }, { x: r.E2, y: r.y2 }],
                        borderColor: 'rgba(34,197,94,0.4)',
                        borderDash: [4, 4],
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 0,
                        showLine: true,
                        order: 5
                    });
                    // Section 2 vertical dashed
                    datasets.push({
                        label: null,
                        data: [{ x: r.E2, y: 0 }, { x: r.E2, y: r.y2 }],
                        borderColor: 'rgba(34,197,94,0.4)',
                        borderDash: [4, 4],
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 0,
                        showLine: true,
                        order: 5
                    });
                }

                // Critical depth horizontal dashed for yc1
                datasets.push({
                    label: null,
                    data: [{ x: 0, y: r.yc1 }, { x: r.Ec1, y: r.yc1 }],
                    borderColor: 'rgba(74,222,128,0.25)',
                    borderDash: [2, 3],
                    backgroundColor: 'transparent',
                    borderWidth: 1,
                    pointRadius: 0,
                    showLine: true,
                    order: 5
                });
                if (hasTwoQ) {
                    datasets.push({
                        label: null,
                        data: [{ x: 0, y: r.yc2 }, { x: r.Ec2, y: r.yc2 }],
                        borderColor: 'rgba(239,68,68,0.25)',
                        borderDash: [2, 3],
                        backgroundColor: 'transparent',
                        borderWidth: 1,
                        pointRadius: 0,
                        showLine: true,
                        order: 5
                    });
                }

                // Operating point markers (on top)
                datasets.push({
                    label: 'Section 1 (y\u2081=' + r.y1.toFixed(2) + 'm)',
                    data: [{ x: r.E1, y: r.y1 }],
                    borderColor: '#fbbf24',
                    backgroundColor: '#fbbf24',
                    pointRadius: 9,
                    pointStyle: 'circle',
                    showLine: false,
                    order: 1
                });

                if (r.y2 && r.E2) {
                    datasets.push({
                        label: 'Section 2 (y\u2082=' + r.y2.toFixed(2) + 'm)',
                        data: [{ x: r.E2, y: r.y2 }],
                        borderColor: '#22c55e',
                        backgroundColor: '#22c55e',
                        pointRadius: 9,
                        pointStyle: 'triangle',
                        showLine: false,
                        order: 1
                    });
                }
