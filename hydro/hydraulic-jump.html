<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydraulic Jump Calculator - HydroSolve</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Spectral:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4ade80;
            --primary-light: #86efac;
            --accent: #fbbf24;
            --bg: #0a0a0a;
            --surface: #171717;
            --text: #e5e5e5;
            --text-muted: #a3a3a3;
            --border: #404040;
            --error: #ef4444;
            --success: #22c55e;
            --grid: 8px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Spectral', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: calc(var(--grid) * 6);
        }

        header {
            border-bottom: 3px solid var(--primary);
            padding-bottom: calc(var(--grid) * 3);
            margin-bottom: calc(var(--grid) * 6);
        }

        .back-link {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: calc(var(--grid) * 2);
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--primary); }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.02em;
            margin-bottom: calc(var(--grid) * 1);
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: calc(var(--grid) * 4);
            align-items: start;
        }

        .input-panel {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 4);
            position: sticky;
            top: calc(var(--grid) * 3);
            max-height: calc(100vh - calc(var(--grid) * 6));
            overflow-y: auto;
        }

        .results-panel {
            background: var(--surface);
            border: 2px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 4);
        }

        .panel-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: calc(var(--grid) * 3);
            padding-bottom: calc(var(--grid) * 2);
            border-bottom: 1px solid var(--border);
        }

        .form-section { margin-bottom: calc(var(--grid) * 4); }

        .section-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: calc(var(--grid) * 2);
        }

        .input-group { margin-bottom: calc(var(--grid) * 2); }

        label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: calc(var(--grid) * 1);
        }

        input, select {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: calc(var(--grid) * 1.5);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            transition: border-color 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        input::placeholder { color: #505050; }
        input:disabled { opacity: 0.4; cursor: not-allowed; background: var(--surface); }

        .selector-group {
            display: flex;
            gap: calc(var(--grid) * 1);
            flex-wrap: wrap;
            margin-bottom: calc(var(--grid) * 3);
        }

        .selector-btn {
            padding: calc(var(--grid) * 1) calc(var(--grid) * 2);
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 2px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            text-transform: uppercase;
        }
        .selector-btn:hover { border-color: var(--primary); }
        .selector-btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        .calculate-button {
            width: 100%;
            background: var(--primary);
            color: var(--bg);
            border: none;
            border-radius: 4px;
            padding: calc(var(--grid) * 2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: calc(var(--grid) * 2);
        }
        .calculate-button:hover { background: var(--primary-light); }

        .example-btn {
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 1.5);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: calc(var(--grid) * 1);
            text-align: left;
        }
        .example-btn:hover { border-color: var(--primary); color: var(--primary); }

        .results-empty {
            text-align: center;
            padding: calc(var(--grid) * 8);
        }

        .result-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 3);
            margin-bottom: calc(var(--grid) * 3);
        }
        .result-card.success { border-color: var(--success); }
        .result-card.error { border-color: var(--error); }

        .result-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--success);
            margin-bottom: calc(var(--grid) * 2);
        }
        .result-header.error { color: var(--error); }
        .result-header.warning { color: var(--accent); }

        .result-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: calc(var(--grid) * 1);
        }

        .result-label { font-size: 0.875rem; color: var(--text-muted); }

        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(var(--grid) * 2);
        }

        .result-item { display: flex; flex-direction: column; }

        .result-item-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: calc(var(--grid) * 0.5);
        }

        .result-item-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            color: var(--text);
        }

        .step-section {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 3);
            margin-bottom: calc(var(--grid) * 3);
        }

        .step-header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.125rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: calc(var(--grid) * 2);
            padding-bottom: calc(var(--grid) * 2);
            border-bottom: 1px solid var(--border);
        }

        .reasoning-box {
            background: rgba(251, 191, 36, 0.1);
            border-left: 3px solid var(--accent);
            padding: calc(var(--grid) * 2);
            margin: calc(var(--grid) * 2) 0;
            font-style: italic;
            color: var(--text);
        }

        .warning-box {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid var(--error);
            padding: calc(var(--grid) * 2);
            margin: calc(var(--grid) * 2) 0;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        .success-box {
            background: rgba(74, 222, 128, 0.1);
            border-left: 3px solid var(--success);
            padding: calc(var(--grid) * 2);
            margin: calc(var(--grid) * 2) 0;
            color: var(--text);
        }

        .math-display {
            background: var(--bg);
            border-left: 3px solid var(--primary);
            padding: calc(var(--grid) * 2);
            margin: calc(var(--grid) * 1) 0;
            overflow-x: auto;
        }

        .f-iteration-table {
            width: 100%;
            border-collapse: collapse;
            margin: calc(var(--grid) * 2) 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
        }
        .f-iteration-table th {
            background: var(--primary);
            color: #000;
            padding: calc(var(--grid) * 1.5);
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
        }
        .f-iteration-table td {
            padding: calc(var(--grid) * 1.5);
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .f-iteration-table tr:last-child td { border-bottom: 2px solid var(--primary); }
        .f-iteration-table tr:last-child { background: rgba(74, 222, 128, 0.05); }

        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin: calc(var(--grid) * 2) 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }
        .summary-table th {
            background: var(--primary);
            color: #000;
            padding: calc(var(--grid) * 1.5);
            text-align: left;
            font-weight: 700;
            text-transform: uppercase;
        }
        .summary-table td {
            padding: calc(var(--grid) * 1.5);
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        .summary-table tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .regime-badge {
            display: inline-block;
            padding: calc(var(--grid) * 0.5) calc(var(--grid) * 1.5);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
        }
        .regime-badge.subcritical { background: rgba(74, 222, 128, 0.15); color: var(--primary); }
        .regime-badge.supercritical { background: rgba(239, 68, 68, 0.15); color: var(--error); }

        .chart-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 3);
            margin-bottom: calc(var(--grid) * 3);
        }

        .schematic-container {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: calc(var(--grid) * 2);
            margin-bottom: calc(var(--grid) * 3);
            text-align: center;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        @media (max-width: 1024px) {
            .main-grid { grid-template-columns: 1fr; }
            .input-panel { position: static; max-height: none; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div id="root"><p style="color:#e5e5e5;font-family:monospace;padding:48px;text-align:center;">Loading calculator...</p></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const G = 9.81;

        // ===================== CHANNEL GEOMETRY HELPERS =====================

        function channelProps(shape, y, b, z) {
            if (shape === 'rectangular') {
                var A = b * y;
                var T = b;
                var ybar = y / 2;
                var D = y;
                return { A: A, T: T, ybar: ybar, D: D };
            } else if (shape === 'triangular') {
                var A = z * y * y;
                var T = 2 * z * y;
                var ybar = y / 3;
                var D = y / 2;
                return { A: A, T: T, ybar: ybar, D: D };
            } else {
                // trapezoidal
                var A = (b + z * y) * y;
                var T = b + 2 * z * y;
                var ybar = (y * (3 * b + 2 * z * y)) / (6 * (b + z * y));
                var D = A / T;
                return { A: A, T: T, ybar: ybar, D: D };
            }
        }

        function specificForce(shape, y, Q, b, z) {
            var p = channelProps(shape, y, b, z);
            return p.ybar * p.A + (Q * Q) / (G * p.A);
        }

        function specificForcePerB(shape, y, q, Q, b, z) {
            if (shape === 'rectangular') {
                return (y * y) / 2 + (q * q) / (G * y);
            }
            return specificForce(shape, y, Q, b, z);
        }

        function froudeNumber(shape, y, Q, b, z) {
            var p = channelProps(shape, y, b, z);
            var V = Q / p.A;
            return V / Math.sqrt(G * p.D);
        }

        function specificEnergy(shape, y, Q, b, z) {
            var p = channelProps(shape, y, b, z);
            var V = Q / p.A;
            return y + (V * V) / (2 * G);
        }

        // ===================== CONJUGATE DEPTH SOLVERS =====================

        function conjugateRectangular(yKnown, q) {
            var Fr = q / Math.sqrt(G * yKnown * yKnown * yKnown);
            var ratio = 0.5 * (Math.sqrt(1 + 8 * Fr * Fr) - 1);
            return yKnown * ratio;
        }

        function conjugateIterative(shape, yKnown, Q, b, z, knownSide) {
            var Fknown = specificForce(shape, yKnown, Q, b, z);
            var yGuess;
            if (knownSide === 'downstream') {
                yGuess = yKnown / 3;
            } else {
                yGuess = yKnown * 3;
            }
            if (yGuess < 0.001) yGuess = 0.01;

            var iterations = [];
            for (var i = 0; i < 50; i++) {
                var F = specificForce(shape, yGuess, Q, b, z);
                var error = F - Fknown;

                iterations.push({
                    iteration: i + 1,
                    y: yGuess,
                    F: F,
                    Ftarget: Fknown,
                    error: error
                });

                if (Math.abs(error) < 1e-6) break;

                // Derivative of F w.r.t. y
                var dy = yGuess * 1e-6;
                var Fplus = specificForce(shape, yGuess + dy, Q, b, z);
                var dFdy = (Fplus - F) / dy;

                if (Math.abs(dFdy) < 1e-15) break;

                var yNew = yGuess - error / dFdy;
                if (yNew < 0.001) yNew = yGuess / 2;
                yGuess = yNew;
            }

            return { y: yGuess, iterations: iterations };
        }

        // ===================== HEAD LOSS =====================

        function headLossRect(y1, y2) {
            return Math.pow(y2 - y1, 3) / (4 * y1 * y2);
        }

        function headLossGeneral(shape, y1, y2, Q, b, z) {
            var E1 = specificEnergy(shape, y1, Q, b, z);
            var E2 = specificEnergy(shape, y2, Q, b, z);
            return E1 - E2;
        }

        // ===================== JUMP CLASSIFICATION =====================

        function classifyJump(Fr1) {
            if (Fr1 < 1.7) return { type: 'Undular Jump', range: '1.0 - 1.7', desc: 'Standing waves, smooth surface', loss: '< 5%' };
            if (Fr1 < 2.5) return { type: 'Weak Jump', range: '1.7 - 2.5', desc: 'Small rollers, low turbulence', loss: '5-15%' };
            if (Fr1 < 4.5) return { type: 'Oscillating Jump', range: '2.5 - 4.5', desc: 'Unstable, pulsating action', loss: '15-45%' };
            if (Fr1 < 9.0) return { type: 'Steady Jump', range: '4.5 - 9.0', desc: 'Well-defined roller, best for design', loss: '45-70%' };
            return { type: 'Strong Jump', range: '> 9.0', desc: 'Rough, intermittent, high dissipation', loss: '> 70%' };
        }

        // ===================== EXAMPLES =====================

        var examples = {
            example3_5: {
                name: 'Ex 3.5 - Triangular Channel Jump',
                shape: 'triangular',
                z: '2',
                Q: '30',
                problemType: 'simple_given_y2',
                y2: '3.0',
                b: '',
                y1: '',
                y2_actual: '',
                y2_conjugate: ''
            },
            example3_6: {
                name: 'Ex 3.6 - Jump with Baffle Blocks',
                shape: 'rectangular',
                b: '10',
                Q: '150',
                problemType: 'baffle',
                y2_conjugate: '5',
                y2_actual: '4',
                z: '',
                y1: '',
                y2: ''
            },
            rectangularJump: {
                name: 'Simple Rectangular Jump',
                shape: 'rectangular',
                b: '5',
                Q: '20',
                problemType: 'simple_given_y1',
                y1: '0.5',
                z: '',
                y2: '',
                y2_actual: '',
                y2_conjugate: ''
            },
            trapezoidalJump: {
                name: 'Trapezoidal Channel Jump',
                shape: 'trapezoidal',
                b: '3',
                z: '1.5',
                Q: '25',
                problemType: 'simple_given_y1',
                y1: '0.8',
                y2: '',
                y2_actual: '',
                y2_conjugate: ''
            }
        };

        // ===================== MAIN COMPONENT =====================

        function HydraulicJumpCalc() {
            var _s1 = useState('rectangular');
            var shape = _s1[0], setShape = _s1[1];

            var _s2 = useState('simple_given_y1');
            var problemType = _s2[0], setProblemType = _s2[1];

            var _s3 = useState({ b: '', z: '', Q: '', y1: '', y2: '', y2_actual: '', y2_conjugate: '' });
            var inputs = _s3[0], setInputs = _s3[1];

            var _s4 = useState(null);
            var results = _s4[0], setResults = _s4[1];

            var _s5 = useState(false);
            var pendingSolve = _s5[0], setPendingSolve = _s5[1];

            var schematicRef = useRef(null);

            useEffect(function() {
                if (results && window.MathJax) {
                    setTimeout(function() { window.MathJax.typesetPromise(); }, 150);
                }
            }, [results]);

            useEffect(function() {
                if (results && results.success) {
                    drawCombinedDiagram(results);
                }
            }, [results]);

            // Auto-calculate after loading an example
            useEffect(function() {
                if (pendingSolve) {
                    setPendingSolve(false);
                    solve();
                }
            }, [pendingSolve]);

            function handleInput(field, value) {
                var newInputs = Object.assign({}, inputs);
                newInputs[field] = value;
                setInputs(newInputs);
            }

            function loadExample(key) {
                var ex = examples[key];
                setShape(ex.shape);
                setProblemType(ex.problemType);
                setInputs({
                    b: ex.b || '',
                    z: ex.z || '',
                    Q: ex.Q || '',
                    y1: ex.y1 || '',
                    y2: ex.y2 || '',
                    y2_actual: ex.y2_actual || '',
                    y2_conjugate: ex.y2_conjugate || ''
                });
                setPendingSolve(true);
            }

            // ===================== COMBINED 3-PANEL DIAGRAM =====================
            // Left: Specific-energy curve (E vs y)
            // Center: Hydraulic jump schematic
            // Right: Specific-force curve (F vs y)

            function drawCombinedDiagram(r) {
                var canvas = schematicRef.current;
                if (!canvas) return;
                var ctx = canvas.getContext('2d');
                var W = canvas.width;
                var H = canvas.height;
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, W, H);

                // Panel geometry
                var pad = 45;
                var panelGap = 30;
                var panelW = (W - 2 * pad - 2 * panelGap) / 3;
                var topY = 40;
                var botY = H - 50;
                var plotH = botY - topY;

                // Shared y-axis scale
                var yMax = Math.max(r.y2, r.y1) * 1.5;
                if (r.y2_conjugate) yMax = Math.max(yMax, r.y2_conjugate * 1.35);
                function yToPixel(y) { return botY - (y / yMax) * plotH; }

                // ---- Critical depth for reference ----
                var yc = 0;
                if (r.shape === 'rectangular' && r.q > 0) {
                    yc = Math.pow(r.q * r.q / G, 1.0 / 3.0);
                } else {
                    // Find yc iteratively: Fr = 1
                    var lo = 0.001, hi = yMax;
                    for (var it = 0; it < 60; it++) {
                        var mid = (lo + hi) / 2;
                        var fr = froudeNumber(r.shape, mid, r.Q, r.b || 0, r.z || 0);
                        if (fr > 1) lo = mid; else hi = mid;
                    }
                    yc = (lo + hi) / 2;
                }

                // ===== LEFT PANEL: E-y diagram =====
                var eL = pad;
                var eR = pad + panelW;

                // Generate E-y curve data
                var numPts = 200;
                var ePoints = [];
                var eMax = 0;
                for (var i = 1; i <= numPts; i++) {
                    var yy = (i / numPts) * yMax;
                    var Ev = specificEnergy(r.shape, yy, r.Q, r.b || 0, r.z || 0);
                    if (isFinite(Ev) && Ev > 0 && Ev < yMax * 5) {
                        ePoints.push({ y: yy, E: Ev });
                        if (Ev > eMax) eMax = Ev;
                    }
                }
                // Clamp eMax for display
                eMax = Math.min(eMax, Math.max(r.E1, r.E2) * 1.6);
                function eToX(E) { return eL + (E / eMax) * panelW; }

                // Axes
                ctx.strokeStyle = '#a3a3a3';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(eL, topY); ctx.lineTo(eL, botY); ctx.lineTo(eR, botY);
                ctx.stroke();

                // 45-degree line y = E
                ctx.strokeStyle = 'rgba(163,163,163,0.3)';
                ctx.lineWidth = 1;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(eToX(0), yToPixel(0));
                var diagEnd = Math.min(eMax, yMax);
                ctx.lineTo(eToX(diagEnd), yToPixel(diagEnd));
                ctx.stroke();
                ctx.setLineDash([]);

                // E-y curve
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                var started = false;
                for (var i = 0; i < ePoints.length; i++) {
                    var px = eToX(ePoints[i].E);
                    var py = yToPixel(ePoints[i].y);

            // ===================== SOLVE =====================

            function solve() {
                try {
                    var Q = parseFloat(inputs.Q);
                    var b = parseFloat(inputs.b) || 0;
                    var z = parseFloat(inputs.z) || 0;

                    if (isNaN(Q) || Q <= 0) { setResults({ success: false, error: 'Discharge Q must be positive.' }); return; }
                    if (shape === 'rectangular' && (isNaN(b) || b <= 0)) { setResults({ success: false, error: 'Bottom width b must be positive for rectangular channel.' }); return; }
                    if (shape === 'triangular' && (isNaN(z) || z <= 0)) { setResults({ success: false, error: 'Side slope z must be positive for triangular channel.' }); return; }
                    if (shape === 'trapezoidal' && ((isNaN(b) || b <= 0) || (isNaN(z) || z <= 0))) { setResults({ success: false, error: 'Both b and z must be positive for trapezoidal channel.' }); return; }

                    var q = (shape === 'rectangular') ? Q / b : 0;

                    if (problemType === 'simple_given_y1') {
                        solveSimpleGivenY1(Q, b, z, q);
                    } else if (problemType === 'simple_given_y2') {
                        solveSimpleGivenY2(Q, b, z, q);
                    } else if (problemType === 'baffle') {
                        solveBaffle(Q, b, z, q);
                    }
                } catch (e) {
                    setResults({ success: false, error: 'Calculation error: ' + e.message });
                }
            }

            function solveSimpleGivenY1(Q, b, z, q) {
                var y1 = parseFloat(inputs.y1);
                if (isNaN(y1) || y1 <= 0) { setResults({ success: false, error: 'Upstream depth y\u2081 must be positive.' }); return; }

                var Fr1 = froudeNumber(shape, y1, Q, b, z);
                if (Fr1 < 1.0) { setResults({ success: false, error: 'Fr\u2081 = ' + Fr1.toFixed(3) + ' < 1. The given depth is subcritical (downstream). Use "Given y\u2082" mode.' }); return; }

                var y2, iterations = null;
                if (shape === 'rectangular') {
                    y2 = conjugateRectangular(y1, q);
                } else {
                    var result = conjugateIterative(shape, y1, Q, b, z, 'upstream');
                    y2 = result.y;
                    iterations = result.iterations;
                }

                var Fr2 = froudeNumber(shape, y2, Q, b, z);
                var E1 = specificEnergy(shape, y1, Q, b, z);
                var E2 = specificEnergy(shape, y2, Q, b, z);
                var hL;
                if (shape === 'rectangular') {
                    hL = headLossRect(y1, y2);
                } else {
                    hL = headLossGeneral(shape, y1, y2, Q, b, z);
                }
                var eta = (E2 / E1) * 100;
                var P = 9810 * Q * hL;
                var Lj = 6.1 * y2;
                var jumpClass = classifyJump(Fr1);

                var p1 = channelProps(shape, y1, b, z);
                var p2 = channelProps(shape, y2, b, z);
                var V1 = Q / p1.A;
                var V2 = Q / p2.A;
                var F1 = specificForce(shape, y1, Q, b, z);
                var F2 = specificForce(shape, y2, Q, b, z);
                var F1display = (shape === 'rectangular') ? (y1*y1/2 + q*q/(G*y1)) : F1;
                var F2display = (shape === 'rectangular') ? (y2*y2/2 + q*q/(G*y2)) : F2;

                setResults({
                    success: true,
                    problemType: 'simple',
                    shape: shape,
                    Q: Q, b: b, z: z, q: q,
                    y1: y1, y2: y2,
                    Fr1: Fr1, Fr2: Fr2,
                    E1: E1, E2: E2,
                    hL: hL, eta: eta, P: P, Lj: Lj,
                    jumpClass: jumpClass,
                    p1: p1, p2: p2,
                    V1: V1, V2: V2,
                    F1: F1, F2: F2,
                    F1display: F1display, F2display: F2display,
                    iterations: iterations,
                    givenSide: 'y1'
                });
            }

            function solveSimpleGivenY2(Q, b, z, q) {
                var y2 = parseFloat(inputs.y2);
                if (isNaN(y2) || y2 <= 0) { setResults({ success: false, error: 'Downstream depth y\u2082 must be positive.' }); return; }

                var Fr2 = froudeNumber(shape, y2, Q, b, z);
                if (Fr2 > 1.0) { setResults({ success: false, error: 'Fr\u2082 = ' + Fr2.toFixed(3) + ' > 1. The given depth is supercritical (upstream). Use "Given y\u2081" mode.' }); return; }

                var y1, iterations = null;
                if (shape === 'rectangular') {
                    y1 = conjugateRectangular(y2, q);
                } else {
                    var result = conjugateIterative(shape, y2, Q, b, z, 'downstream');
                    y1 = result.y;
                    iterations = result.iterations;
                }

                var Fr1 = froudeNumber(shape, y1, Q, b, z);
                var E1 = specificEnergy(shape, y1, Q, b, z);
                var E2 = specificEnergy(shape, y2, Q, b, z);
                var hL;
                if (shape === 'rectangular') {
                    hL = headLossRect(y1, y2);
                } else {
